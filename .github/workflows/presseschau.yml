{
"name": "Presseschau",
"on": {
"schedule": [ { "cron": "23 22 * * *" } ],
"workflow_dispatch": {}
},
"permissions": { "contents": "write" },
"concurrency": { "group": "presseschau", "cancel-in-progress": false }, 
"jobs": {
"build": {
"runs-on": "ubuntu-latest",
"timeout-minutes": 20,
"steps": [
{ "uses": "actions/checkout@v4" },
{ "uses": "actions/setup-python@v5",
"with": { "python-version": "3.12", "cache": "pip" } },
{ "run": "pip install -r requirements.txt" },
{ "run": "python build.py" },
{ "run": "git config user.name presseschau-bot" },
{ "run": "git config user.email bot@users.noreply.github.com" },
{ "run": "git add docs" },
{ "run": "git commit -m \"Presseschau $(TZ=Asia/Taipei date +%F)\" || echo 
nothing" }, { "run": "git push" }
]
}
}
}
