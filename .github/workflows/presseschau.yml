name: Tägliche Presseschau 
on:
 schedule:
 # 每天 22:23 UTC = 台灣時間 06:23（德國時間 23:23，正好涵蓋德國一整天的新聞） 
 # GitHub 的排程有時會晚 10–30 分鐘。
 - cron: "23 22 * * *"
 workflow_dispatch: # 可在 Actions 頁面手動按「Run workflow」
permissions: 
 contents: write
concurrency:
 group: presseschau
 cancel-in-progress: false
jobs: 
 build:
 runs-on: ubuntu-latest 
 timeout-minutes: 20
 steps:
 - uses: actions/checkout@v4
 - uses: actions/setup-python@v5 
 with:
 python-version: "3.12"
 cache: pip
 - run: pip install -r requirements.txt
 - run: python build.py
 - name: Speichern
 run: |
 git config user.name "presseschau-bot"
 git config user.email "41898282+github-actions
[bot]@users.noreply.github.com"  git add docs
 git commit -m "Presseschau $(TZ=Asia/Taipei date +%F)" || echo "Keine
Änderungen"  git push
